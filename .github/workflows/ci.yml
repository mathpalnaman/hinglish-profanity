name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 is the floor declared in package.json engines; 24 is current.
        node: [18, 20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Corpus
        run: npm test

      - name: Build
        run: npm run build

      # A published package is only correct if a stranger can install it.
      # This catches a broken exports map, which `npm test` cannot see.
      - name: Install the tarball as a consumer and import it both ways
        run: |
          npm pack
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y
          npm install "$GITHUB_WORKSPACE"/hinglish-profanity-*.tgz
          node -e "const {detect}=require('hinglish-profanity'); if(!detect('kya chutiya aadmi').matches.length) process.exit(1); console.log('cjs ok')"
          node --input-type=module -e "import {detect} from 'hinglish-profanity'; if(!detect('l u n d').matches.length) process.exit(1); console.log('esm ok')"

      # The tarball must carry dist/ only: nothing from java/, scripts/ or the fixtures.
      - name: Tarball contains only dist, README, LICENSE and package.json
        run: |
          npm pack --dry-run --json | node -e "
            const files = JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].files.map(f => f.path);
            const bad = files.filter(p => !/^(dist\/|README\.md$|LICENSE$|package\.json$)/.test(p));
            if (bad.length) { console.error('unexpected files in tarball:', bad); process.exit(1); }
            console.log(files.length + ' files, all expected');"

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Corpus, self-check, schema, thread-safety, and parity against the
      # committed parity.json.
      - name: Test
        working-directory: java
        run: ./gradlew test

      # What JitPack runs (jitpack.yml), so a broken publication fails here first.
      - name: Build and publish to the local Maven repository
        working-directory: java
        run: ./gradlew clean build publishToMavenLocal -x test

  # parity.json is generated from the JS build and committed. This job proves
  # the committed copy is what the current JS produces, then runs Java against
  # it — so "Java matches JS" always means the JS on this commit.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned: the fixture depends on the Unicode tables of the Node runtime.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Regenerate parity.json from the JS build
        run: npm run gen:parity

      - name: parity.json is up to date
        run: git diff --exit-code test/fixtures/parity.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Java reproduces every JS result
        working-directory: java
        run: ./gradlew test --tests '*ParityTest' --tests '*WordlistTest'
